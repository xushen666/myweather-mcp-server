
[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "weather-mcp-server"
version = "0.1.0"
description = "Weather MCP Server based on HelloAgents"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "hello-agents>=0.2.1",
    "requests>=2.31.0"
]

[tool.setuptools]
py-modules = ["server"]
